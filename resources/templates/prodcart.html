<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Product Details</title></head>
<body>
    <h1 th:text="${product.proname}">Product Name</h1>
    <p th:text="${product.description}">Product Description</p>
    <p>Price: ₹<span th:text="${product.price}">0</span></p>

    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
        <button type="submit">Book / Add to Cart</button>
    </form>

    <p><a th:href="@{/shop}">← Back to Shop</a></p>
</body>
</html>
